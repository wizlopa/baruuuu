<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>WebAR Custom Marker</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js Marker Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .instruction {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            padding: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 8px;
            text-align: center;
            z-index: 10;
        }

        .loading {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 15px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="instruction">
        Benarkan akses kamera dan halakan ke marker anda.
    </div>

    <div class="loading" id="loadingMessage">
        Memuatkan model 3D...
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="
            logarithmicDepthBuffer: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "
        arjs="
            sourceType: webcam;
            trackingMethod: best;
            debugUIEnabled: false;
        "
    >

        <!-- Preload 3D Model -->
        <a-assets timeout="20000">
            <a-asset-item
                id="blenderModel"
                src="./model.glb">
            </a-asset-item>
        </a-assets>

        <!-- Lighting -->
        <a-light
            type="ambient"
            color="#FFFFFF"
            intensity="1.3">
        </a-light>

        <a-light
            type="directional"
            color="#FFFFFF"
            intensity="1.5"
            position="1 3 2">
        </a-light>

        <!-- Custom Pattern Marker -->
        <!-- Tukar nama 'pattern-marker.patt' mengikut nama fail anda -->
        <a-marker type="pattern" url="./pattern-marker.patt">

            <!-- Blender GLB model -->
            <a-entity
                id="model"
                gltf-model="#blenderModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 12000;
                    easing: linear;
                "
            >
            </a-entity>

        </a-marker>

        <!-- AR camera -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const model = document.querySelector("#model");
        const loadingMessage = document.querySelector("#loadingMessage");

        model.addEventListener("model-loaded", function () {
            loadingMessage.textContent = "Model selesai dimuat. Imbas marker anda.";

            setTimeout(function () {
                loadingMessage.style.display = "none";
            }, 3000);
        });

        model.addEventListener("model-error", function () {
            loadingMessage.textContent = "Ralat: Fail model.glb tidak dapat dimuat.";
        });
    </script>

</body>
</html>
